<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Muzeum 303</title>
    <style>
        :root {
            --primary-color: #D4AF37;
            --bg-color: #0C0C0C;
            --text-color: #E5E5E5;
            --hotspot-size: 40px;
            --transition-duration: 0.8s;
            --bg-image: url('assets/bg-tło nowe.png');
        }

        @media (max-width: 768px) {
            :root {
                --bg-image: url('assets/bg-tło nowe.png');
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: var(--text-color);
            overflow: hidden;
            touch-action: none; /* Prevent pull-to-refresh on mobile */
        }

        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Home Screen */
        #home-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a1a, #000000);
            z-index: 100;
            text-align: center;
            padding: 2rem;
            transition: opacity 0.5s ease;
        }

        #home-screen h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        #home-screen p {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 2rem;
            max-width: 600px;
            line-height: 1.6;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 9999px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
        }

        button:active { transform: scale(0.95); }
        button:hover { opacity: 0.9; }

        /* Exhibit Container */
        #exhibit-container {
            position: absolute;
            inset: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            background-color: var(--bg-color);
            background-image: url('assets/bg-tło nowe.png'); background-size: cover; background-position: center; border-radius: 0;
        }

        @media (max-width: 768px) {
            #exhibit-container {
                
            }
        }

        #exhibit-container.active {
            opacity: 1;
            pointer-events: auto;
        }

        .scene-wrapper {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            z-index: 1;
            /* Inactive wrappers shouldn't capture clicks */
            pointer-events: none;
        }
        
        .scene-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .scene-hotspots {
            position: absolute;
            inset: 0;
        }

        /* Hotspots */
        .hotspot {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.2s, background-color 0.2s, color 0.2s, box-shadow 0.2s;
            z-index: 10;
            border-style: solid;
        }

        .hotspot:hover {
            transform: translate(-50%, -50%) scale(1.1);
        }
        
        /* Audio Toggle */
        #audio-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-color);
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        
        #audio-toggle.visible {
            opacity: 1;
            pointer-events: auto;
        }
        
        #audio-toggle svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        .hotspot svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Modal */
        #info-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
            padding: 20px;
        }

        #info-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #1a1a1a;
            padding: 2rem;
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            border: 1px solid #333;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transform: translateY(20px);
            transition: transform 0.3s ease;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        #info-modal.active .modal-content {
            transform: translateY(0);
        }

        .modal-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
            flex-shrink: 0;
        }

        .modal-text {
            line-height: 1.6;
            color: #ddd;
            margin-bottom: 1.5rem;
            overflow-y: auto;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .close-btn {
            background: transparent;
            border: 1px solid #555;
            color: white;
            width: 100%;
            padding: 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .close-btn:hover {
            background: #333;
        }

        .speak-btn {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none;
            flex-shrink: 0;
        }
        .speak-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.1);
        }
        .speak-btn.playing {
            color: var(--primary-color);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .speak-btn svg { 
            width: 24px; 
            height: 24px; 
            stroke: currentColor; 
            stroke-width: 2; 
            fill: none; 
            stroke-linecap: round; 
            stroke-linejoin: round; 
        }

    </style>
</head>

        <div id="home-screen">

            <button id="start-btn">Rozpocznij</button>

        <div id="exhibit-container">

        <div id="info-modal">

                </div>
                <p class="modal-text" id="modal-text"></p>
                <button class="close-btn" id="close-modal-btn">Close</button>
            </div>
        </div>
    </div>

          "infoTitle": "Cichociemny",
          "infoText": "Cichociemny żołnierz Armii Krajowej w chwili wylądowania na polskiej ziemi w okupowanym kraju.\nSkoczkowie ci oddawali skok w kombinezonie maskowniczym SOE, nałożonym na specjalnie spreparowane ubranie cywilne, typowe do stylu i dostępności w okupowanej Polsce. \nW kieszeni ma przygotowane dokumenty legalizacyjne, czyli Kenkartę oraz gazetę okupacyjną \n,,Nowy Kurier Warszawski”, zwaną ,,gadzinówką”. \nNa głowie widoczny jeszcze kask kombinezonu zrzutowego z okularami, który po skoku skoczek razem z kombinezonem i spadochronem zakopywał w ziemi. Cichociemni przez odlotem do Kraju byli zaprzysięgani na rotę przysięgi Armii Krajowej. Ich tradycje przejęła w Polsce Jednostka Wojskowa GROM."

          "infoTitle": "Jan Biały CC",
          "infoText": "Jan Biały, ps. „Kadłub”, „Pokrywka” - pułkownik pilot Wojska Polskiego, dowódca 304 Dywizjonu Bombowego „Ziemi Śląskiej”, Cichociemny.\nPrzeszkolony ze specjalnością w lotnictwie na kursach specjalnych dla kandydatów na cichociemnych, m.in. dywersyjno–strzeleckim, podstaw wywiadu, taktyczno-informacyjnym, pilotażu i obsługi sprzętu niemieckiego: samolotów He-111H, Bf110C i Ju-88A, spadochronowym, odprawowym.  Zaprzysiężony na rotę AK 5 listopada 1943 roku.\n\n[image:qbezvw]\n\nSkok do Polski 27/28 kwietnia 1944 roku w sezonie operacyjnym „Riposta”, w operacji lotniczej „Weller 21\", z samolotu Liberator EV-978 „R” (1586 Eskadra PAF) na placówkę odbiorczą „Koza”, w okolicach miejscowości Bychawka, Bystrzyca, 18 km od Lublina.\nZnak Spadochronowy Armii Krajowej nr 189-/1964 – znajduje się wraz z mundurem lotniczym w Muzeum Dywizjonu 303.",

          "type": "info",

            "variant": "square",

          },
          "infoText": "Należała do Albina Łakomego vel Tomasza Sarneka, pseud.: ,,Twornik”, ,,Brzęczyk” – starszy sierżant lotnictwa,\nradiomechanik i radiotelegrafista, Cichociemny.\nZaprzysiężony 4 marca 1943 roku w Oddziale VI Sztabu Naczelnego Wodza i przeniesiony do\nGłównej Bazy Przerzutowej w Brindisi we Włoszech. Skok do Polski z 9/10 kwietnia 1944\nroku w ramach operacji „Weller 1”. Dostał przydział do Oddziału V Łączności sztabu Okręgu\nLublin AK, do oddziału partyzanckiego „Pająk”, będącego oddziałem radiołączności Komendy\nOkręgu, na stanowisko oficera teletechnicznego. Obsługiwał radiostację Komendy Okręgu\nw okresie od 1 maja do 30 lipca 1944 roku. Prowadził szkolenia dla żołnierzy i dowodził\nplutonem. Brał jednocześnie udział w wielu walkach, m.in.: w Pamięcinie, Walentynowie,\nPilaszkowicach i Piaskach Luterskich.\n[image:ky78ml]\nPamiątki z czasu służby w 1.SBS: papierośnica z insygniami i grawerunkiem 1.SBS, scyzoryk\nz grawerunkiem, gwizdek z grawerunkiem i odznaką pamiątkową 1.SBS (tzw. sweetheart )\n– w posiadaniu Muzeum Dywizjonu 303.",

            'dir-down': '<path d="m6 9 6 6 6-6"/>',
            'info': '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
            'zoom': '<circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="11" x2="11" y1="8" y2="14"/><line x1="8" x2="14" y1="11" y2="11"/>',
            'link': '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>'
        };

        // DOM elements
        const sceneElements = {};
        
        function updateImagesForDevice() {
            config.scenes.forEach(scene => {
                if (sceneElements[scene.id]) {
                    sceneElements[scene.id].img.src = (isMobile && scene.mobileImageUrl) ? scene.mobileImageUrl : scene.imageUrl;
                    renderHotspotsInto(scene, sceneElements[scene.id].hsContainer);
                }
            });
        }

        config.scenes.forEach(scene => {
            const container = document.createElement('div');
            container.className = 'scene-wrapper';
            container.id = 'scene-' + scene.id;

            const img = new Image();
            img.src = (isMobile && scene.mobileImageUrl) ? scene.mobileImageUrl : scene.imageUrl;
            img.className = 'scene-image';
            img.id = 'img-' + scene.id;

            const hsContainer = document.createElement('div');
            hsContainer.className = 'scene-hotspots';
            hsContainer.id = 'hotspots-' + scene.id;

            container.appendChild(img);
            container.appendChild(hsContainer);
            imagesContainer.appendChild(container);
            
            sceneElements[scene.id] = { container, img, hsContainer };

            // Pre-render hotspots
            renderHotspotsInto(scene, hsContainer);
        });

        startBtn.addEventListener('click', () => {
            const tType = config.theme.initialTransitionType || 'none';
            const tDur = config.theme.initialTransitionDuration !== undefined ? config.theme.initialTransitionDuration : 0.5;
            
            if (audio && !isPlaying) {
                audio.play().catch(e => console.log("Audio autoplay prevented"));
                isPlaying = true;
                audioToggle.style.opacity = '1';
            }
            
            homeScreen.style.transition = `all ${tDur}s ease-in-out`;
            exhibitContainer.style.transition = `all ${tDur}s ease-in-out`;
            
            let startSceneId = config.initialSceneId;
            if (isMobile && config.mobileInitialSceneId) {
                startSceneId = config.mobileInitialSceneId;
            }
            if (!startSceneId && config.scenes.length > 0) {
                startSceneId = config.scenes[0].id;
            }
            
            if (tType === 'none') {
                homeScreen.style.display = 'none';
                exhibitContainer.style.transition = 'none';
                exhibitContainer.classList.add('active');
                if (startSceneId) loadScene(startSceneId, 'global', null, true);
            } else if (tType === 'fade-black') {
                const halfDur = tDur / 2;
                fadeOverlay.style.transition = `opacity ${halfDur}s ease-in-out`;
                fadeOverlay.style.opacity = '1';
                
                setTimeout(() => {
                    homeScreen.style.display = 'none';
                    exhibitContainer.style.transition = 'none';
                    exhibitContainer.classList.add('active');
                    if (startSceneId) loadScene(startSceneId, 'global', null, true);
                    
                    fadeOverlay.style.opacity = '0';
                }, halfDur * 1000);
            } else if (tType === 'slide') {
                homeScreen.style.transform = 'translateX(-100%)';
                exhibitContainer.style.transition = 'none';
                exhibitContainer.style.transform = 'translateX(100%)';
                exhibitContainer.classList.add('active');
                
                setTimeout(() => {
                    exhibitContainer.style.transition = `transform ${tDur}s ease-in-out`;
                    exhibitContainer.style.transform = 'translateX(0)';
                }, 50);

                if (startSceneId) loadScene(startSceneId, 'global', null, true);
                
                setTimeout(() => {
                    homeScreen.style.display = 'none';
                }, tDur * 1000);
            } else { // fade or mix
                homeScreen.style.opacity = '0';
                exhibitContainer.classList.add('active');
                
                if (startSceneId) loadScene(startSceneId, 'global', null, true);
                
                setTimeout(() => {
                    homeScreen.style.display = 'none';
                }, tDur * 1000);
            }
        });

        function handleHotspotClick(hotspot) {
            if (['nav', 'dir-left', 'dir-right', 'dir-up', 'dir-down', 'zoom'].includes(hotspot.type) || (hotspot.type === 'image' && hotspot.actionType === 'nav')) {
                if (hotspot.targetSceneId) {
                    loadScene(hotspot.targetSceneId, hotspot.transitionType, hotspot.transitionDuration);
                }
            } else if (hotspot.type === 'info' || (hotspot.type === 'image' && hotspot.actionType === 'info')) {
                modalTitle.textContent = hotspot.infoTitle || 'Information';
                let text = hotspot.infoText || '';
                
                // Replace image placeholders with actual image tags
                if (hotspot.infoImages && hotspot.infoImages.length > 0) {
                    hotspot.infoImages.forEach(img => {
                        const targetStr = '[image:' + img.id + ']';
                        const imgTag = '<img src="' + img.url + '" style="max-width: 100%; border-radius: 8px; margin: 10px 0; display: block;" alt="description image" />';
                        text = text.split(targetStr).join(imgTag);
                    });
                }
                
                // Convert newlines to breaks for proper paragraphing
                text = text.replace(/\r?\n/g, '<br/>');
                
                modalText.innerHTML = text;
                infoModal.classList.add('active');
            } else if (hotspot.type === 'link' || (hotspot.type === 'image' && hotspot.actionType === 'link')) {
                if (hotspot.linkUrl) {
                    window.open(hotspot.linkUrl, '_blank');
                }
            }
        }

        let transitionTimeout = null;

        function loadScene(sceneId, overrideTransitionType = 'global', overrideDuration = null, isInitial = false) {
            if (!sceneId) return;
            
            let transitionType = (overrideTransitionType && overrideTransitionType !== 'global') 
                ? overrideTransitionType 
                : (config.theme.transitionType || 'fade');

            let rawDuration = overrideDuration !== null && overrideDuration !== undefined
                ? overrideDuration 
                : config.theme.transitionDuration;
                
            if (isInitial) {
                transitionType = config.theme.initialTransitionType || 'none';
                if (config.theme.initialTransitionDuration !== undefined) {
                    rawDuration = config.theme.initialTransitionDuration;
                }
            }

            if (rawDuration === undefined) rawDuration = 0.5;

            const dur = parseFloat(rawDuration);

            // Clear any pending transitions if user clicks quickly
            if (transitionTimeout) clearTimeout(transitionTimeout);

            const targetSceneConf = config.scenes.find(s => s.id === sceneId);
            
            // Set dynamic background image for exhibit container
            let sceneBg = isMobile 
                ? (targetSceneConf && targetSceneConf.mobileBackgroundUrl ? targetSceneConf.mobileBackgroundUrl : (targetSceneConf && targetSceneConf.backgroundUrl ? targetSceneConf.backgroundUrl : config.theme.mobileBackgroundImageUrl || config.theme.backgroundImageUrl))
                : (targetSceneConf && targetSceneConf.backgroundUrl ? targetSceneConf.backgroundUrl : config.theme.backgroundImageUrl);
                
            if (sceneBg) {
                exhibitContainer.style.backgroundImage = `url('${sceneBg}')`;
                exhibitContainer.style.backgroundSize = 'cover';
                exhibitContainer.style.backgroundPosition = 'center';
            } else {
                exhibitContainer.style.backgroundImage = 'none';
            }

            const oldEls = currentSceneId ? sceneElements[currentSceneId] : null;
            const newEls = sceneElements[sceneId];
            
            const oldContainer = oldEls ? oldEls.container : null;
            const newContainer = newEls ? newEls.container : null;
            
            // 1. Instantly hide any containers that aren't the old or the new
            Object.values(sceneElements).forEach(els => {
                if (els.container !== oldContainer && els.container !== newContainer) {
                    els.container.style.transition = 'none';
                    els.container.style.opacity = '0';
                    els.container.style.transform = 'none';
                    els.container.style.zIndex = '1';
                    els.container.style.pointerEvents = 'none';
                }
            });
            
            // 2. Prep new container starting positions
            if (newContainer) {
                newContainer.style.transition = 'none';
                if (transitionType === 'slide') {
                    newContainer.style.transform = 'translateX(100%)';
                    newContainer.style.opacity = '1';
                } else if (transitionType === 'fade' || transitionType === 'mix' || transitionType === 'fade-black') {
                    newContainer.style.transform = 'none';
                    newContainer.style.opacity = '0';
                } else {
                    newContainer.style.transform = 'none';
                    newContainer.style.opacity = '1';
                }
                newContainer.style.zIndex = '2'; // new comes on top
                newContainer.style.pointerEvents = 'auto'; // allow clicks
            }

            if (oldContainer && oldContainer !== newContainer) {
                oldContainer.style.zIndex = '1'; 
                // Don't allow clicks on the old one while it's transitioning away
                oldContainer.style.pointerEvents = 'none'; 
            }

            // Force reflow so DOM updates visually before we animate
            void imagesContainer.offsetWidth;
            
            currentSceneId = sceneId;

            // 3. Launch transitions
            if (transitionType === 'slide') {
                if (newContainer) {
                    newContainer.style.transition = `transform ${dur}s ease-in-out`;
                    newContainer.style.transform = 'translateX(0)';
                }
                if (oldContainer && oldContainer !== newContainer) {
                    oldContainer.style.transition = `transform ${dur}s ease-in-out`;
                    oldContainer.style.transform = 'translateX(-100%)';
                }
            } else if (transitionType === 'mix') {
                if (newContainer) {
                    newContainer.style.transition = `opacity ${dur}s ease-in-out`;
                    newContainer.style.opacity = '1';
                }
                if (oldContainer && oldContainer !== newContainer) {
                    oldContainer.style.transition = `opacity ${dur}s ease-in-out`;
                    oldContainer.style.opacity = '0';
                }
            } else if (transitionType === 'fade') {
                const halfDur = dur / 2;
                if (oldContainer && oldContainer !== newContainer) {
                    oldContainer.style.transition = `opacity ${halfDur}s ease-in-out`;
                    oldContainer.style.opacity = '0';
                }
                if (newContainer) {
                    setTimeout(() => {
                        newContainer.style.transition = `opacity ${halfDur}s ease-in-out`;
                        newContainer.style.opacity = '1';
                    }, halfDur * 1000);
                }
            } else if (transitionType === 'fade-black') {
                const halfDur = dur / 2;
                fadeOverlay.style.transition = `opacity ${halfDur}s ease-in-out`;
                fadeOverlay.style.opacity = '1';
                
                setTimeout(() => {
                    if (oldContainer && oldContainer !== newContainer) {
                        oldContainer.style.transition = 'none';
                        oldContainer.style.opacity = '0';
                    }
                    if (newContainer) {
                        newContainer.style.transition = 'none';
                        newContainer.style.opacity = '1';
                    }
                    
                    fadeOverlay.style.opacity = '0';
                }, halfDur * 1000);
            } else {
                if (newContainer) {
                    newContainer.style.transition = 'none';
                    newContainer.style.opacity = '1';
                }
                if (oldContainer && oldContainer !== newContainer) {
                    oldContainer.style.transition = 'none';
                    oldContainer.style.opacity = '0';
                }
            }
        }

        function renderHotspotsInto(scene, container) {
            container.innerHTML = '';
            const hotspotsToRender = isMobile 
                ? (scene.mobileHotspots || []) 
                : scene.hotspots;

            hotspotsToRender.forEach(hotspot => {
                const el = document.createElement('div');
                el.className = 'hotspot';
                el.style.pointerEvents = 'auto'; // allow clicking
                
                // Apply custom styles
                const size = hotspot.style?.size || config.theme.hotspotSize;
                const color = hotspot.style?.color || config.theme.color;
                const bgOpacity = hotspot.style?.bgOpacity !== undefined ? hotspot.style.bgOpacity : 0.2;
                const borderWidth = hotspot.style?.borderWidth !== undefined ? hotspot.style.borderWidth : 2;
                const rotation = hotspot.style?.rotation || 0;
                const variant = hotspot.style?.variant || config.theme.style || 'modern';
                
                const isSquare = variant === 'square';
                const isNeon = variant === 'neon';
                const isClassic = variant === 'classic';

                el.style.left = hotspot.x + '%';
                el.style.top = hotspot.y + '%';
                el.style.width = size + 'px';
                el.style.height = size + 'px';
                el.style.borderRadius = isSquare ? '10px' : '50%';
                
                // Convert hex to rgba for background
                let r=0, g=0, b=0;
                if (color.startsWith('#')) {
                    const hex = color.replace('#', '');
                    if (hex.length === 3) {
                        r = parseInt(hex.charAt(0) + hex.charAt(0), 16);
                        g = parseInt(hex.charAt(1) + hex.charAt(1), 16);
                        b = parseInt(hex.charAt(2) + hex.charAt(2), 16);
                    } else if (hex.length === 6) {
                        r = parseInt(hex.substring(0,2), 16);
                        g = parseInt(hex.substring(2,4), 16);
                        b = parseInt(hex.substring(4,6), 16);
                    }
                }
                
                const rgbaBg = `rgba(${r},${g},${b},${bgOpacity})`;

                if (isClassic) {
                    el.style.backgroundColor = color;
                    el.style.borderColor = 'white';
                    el.style.borderWidth = Math.max(borderWidth, 3) + 'px';
                    el.style.color = 'white';
                    el.style.boxShadow = `0 0 0 3px rgba(0,0,0,0.6), 0 6px 20px rgba(0,0,0,0.7), 0 0 18px ${color}88`;
                    el.style.filter = 'drop-shadow(0 2px 8px rgba(0,0,0,0.8))';
                } else if (isNeon) {
                    el.style.backgroundColor = 'transparent';
                    el.style.borderColor = color;
                    el.style.borderWidth = borderWidth + 'px';
                    el.style.color = color;
                    el.style.boxShadow = `0 0 10px ${color}, inset 0 0 10px ${color}`;
                } else if (variant === 'minimal') {
                    el.style.backgroundColor = 'rgba(0,0,0,0.45)';
                    el.style.borderColor = color;
                    el.style.borderWidth = '2px';
                    el.style.color = color;
                    el.style.boxShadow = `0 0 0 2px rgba(0,0,0,0.5), 0 4px 14px rgba(0,0,0,0.7), 0 0 14px ${color}66`;
                    el.style.backdropFilter = 'blur(3px)';
                } else if (variant === 'glass') {
                    el.style.backgroundColor = `rgba(${r},${g},${b},0.2)`;
                    el.style.borderColor = 'rgba(255,255,255,0.4)';
                    el.style.borderWidth = '1px';
                    el.style.color = color;
                    el.style.backdropFilter = 'blur(4px)';
                    el.style.webkitBackdropFilter = 'blur(4px)';
                    el.style.boxShadow = '0 4px 6px rgba(0,0,0,0.1)';
                } else if (variant === 'dashed') {
                    el.style.backgroundColor = 'transparent';
                    el.style.borderColor = color;
                    el.style.borderStyle = 'dashed';
                    el.style.borderWidth = Math.max(borderWidth, 2) + 'px';
                    el.style.color = color;
                    el.style.boxShadow = 'none';
                } else {
                    el.style.backgroundColor = color;
                    el.style.borderColor = 'white';
                    el.style.borderWidth = Math.max(borderWidth, 3) + 'px';
                    el.style.color = 'white';
                    el.style.boxShadow = `0 0 0 3px rgba(0,0,0,0.6), 0 6px 20px rgba(0,0,0,0.7), 0 0 18px ${color}88`;
                    el.style.filter = 'drop-shadow(0 2px 8px rgba(0,0,0,0.8))';
                }
                
                const hasLabel = (hotspot.type === 'link' || hotspot.type === 'image') && hotspot.label;
                const isImage = hotspot.type === 'image';

                if (isImage) {
                    el.style.width = 'auto';
                    el.style.height = 'auto';
                    el.style.padding = '0';
                    el.style.borderRadius = '0';
                    el.style.backgroundColor = 'transparent';
                    el.style.borderColor = 'transparent';
                    el.style.boxShadow = 'none';
                    el.style.borderWidth = '0';
                    el.style.transform = 'translate(-50%, -50%)';
                    
                    let bgImg = hotspot.imageUrl;
                    let imageHtml = bgImg ? `<img src="${bgImg}" alt="" style="max-width: 100px; max-height: 100px; object-fit: contain; pointer-events: none;" />` : `<div style="font-size: 10px; padding: 8px; border: 1px dashed gray; border-radius: 4px; background: rgba(0,0,0,0.5); color: white;">No Image</div>`;
                    
                    if (hasLabel) {
                        el.innerHTML = `<div style="transform: rotate(${rotation}deg); display: flex; flex-direction: column; align-items: center;">
                            ${imageHtml}
                            <span style="font-size: ${Math.max(12, size * 0.3)}px; font-weight: 500; font-family: sans-serif; margin-top: 4px; color: white; text-shadow: 0 1px 3px black;">${hotspot.label}</span>
                        </div>`;
                    } else {
                        el.innerHTML = `<div style="transform: rotate(${rotation}deg); display: flex; align-items: center; justify-content: center;">${imageHtml}</div>`;
                    }
                } else if (hasLabel) {
                    el.style.width = 'auto';
                    el.style.minWidth = size + 'px';
                    el.style.height = 'auto';
                    el.style.minHeight = size + 'px';
                    el.style.padding = '4px 16px';
                    el.style.borderRadius = (size/2) + 'px';
                    el.style.whiteSpace = 'nowrap';
                    
                    el.innerHTML = `<div style="transform: rotate(${rotation}deg); display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 100%;">
                        <div style="width: ${size * 0.5}px; height: ${size * 0.5}px; display: flex; align-items: center; justify-content: center;">
                            <svg viewBox="0 0 24 24" style="width: 100%; height: 100%;">${icons[hotspot.type] || icons['nav']}</svg>
                        </div>
                        <span style="font-size: ${Math.max(12, size * 0.3)}px; font-weight: 500; font-family: sans-serif;">${hotspot.label}</span>
                    </div>`;
                } else {
                    // Handle rotation on the inner SVG wrapper to not mess up the translate(-50%, -50%)
                    el.innerHTML = `<div style="transform: rotate(${rotation}deg); display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;">
                        <svg viewBox="0 0 24 24">${icons[hotspot.type] || icons['nav']}</svg>
                    </div>`;
                }

                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    handleHotspotClick(hotspot);
                });
                
                // Hover effect
                el.addEventListener('mouseenter', () => {
                    if (isClassic || (!isNeon && variant !== 'glass' && variant !== 'dashed' && variant !== 'minimal')) {
                        el.style.backgroundColor = 'white';
                        el.style.color = color;
                        el.style.filter = `drop-shadow(0 2px 12px ${color})`;
                    } else if (isNeon) {
                        el.style.backgroundColor = 'rgba(255,255,255,0.1)';
                    } else if (variant === 'minimal') {
                        el.style.backgroundColor = `rgba(${r},${g},${b},0.3)`;
                    } else {
                        el.style.backgroundColor = color;
                        el.style.color = '#000';
                    }
                });
                el.addEventListener('mouseleave', () => {
                    if (isClassic || (!isNeon && variant !== 'glass' && variant !== 'dashed' && variant !== 'minimal')) {
                        el.style.backgroundColor = color;
                        el.style.color = 'white';
                        el.style.filter = 'drop-shadow(0 2px 8px rgba(0,0,0,0.8))';
                    } else if (isNeon) {
                        el.style.backgroundColor = 'transparent';
                    } else if (variant === 'minimal') {
                        el.style.backgroundColor = 'rgba(0,0,0,0.45)';
                    } else {
                        el.style.backgroundColor = rgbaBg;
                        el.style.color = color;
                    }
                });
                
                container.appendChild(el);
            });
        }

        function stopTTS() {
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }
            isTTSPlaying = false;
            speakBtn.classList.remove('playing');
        }

        speakBtn.addEventListener('click', () => {
            if (!('speechSynthesis' in window)) {
                alert("Text-to-speech is not supported in this browser.");
                return;
            }

            if (isTTSPlaying) {
                stopTTS();
                return;
            }

            const textToRead = (modalTitle.textContent || '') + ". " + (modalText.textContent || '');
            if (!textToRead.trim()) return;

            // Stop background music temporarily if playing
            let wasMusicPlaying = isPlaying;
            if (wasMusicPlaying && audio) {
                audio.pause();
                audioToggle.style.opacity = '0.5';
            }

            stopTTS(); // clear any previous
            
            ttsUtterance = new SpeechSynthesisUtterance(textToRead);
            // Optional: try to auto-detect language based on config or user browser
            ttsUtterance.lang = navigator.language || 'en-US';
            
            ttsUtterance.onend = () => {
                isTTSPlaying = false;
                speakBtn.classList.remove('playing');
                // Resume background music if it was playing
                if (wasMusicPlaying && audio) {
                    audio.play().catch(e => console.log(e));
                    audioToggle.style.opacity = '1';
                }
            };
            
            ttsUtterance.onerror = () => {
                isTTSPlaying = false;
                speakBtn.classList.remove('playing');
            };

            window.speechSynthesis.speak(ttsUtterance);
            isTTSPlaying = true;
            speakBtn.classList.add('playing');
        });

        closeModalBtn.addEventListener('click', () => {
            stopTTS();
            infoModal.classList.remove('active');
        });
        
        infoModal.addEventListener('click', (e) => {
            if (e.target === infoModal) {
                stopTTS();
                infoModal.classList.remove('active');
            }
        });

    </script>
</body>
</html>
